<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>
</head>
<body style="font-family: 'Times New Roman', Times, serif;">

    <h2 align="center" style="color: #336699;">Đăng ký du lịch</h2>

    <form id="frmDangKy">
        <table align="center" border="1" bordercolor="#336699" cellpadding="5" cellspacing="0" style="background-color: #fcf6cd; border-collapse: collapse; width: 600px; color: #336699;">
            <tr>
                <td style="width: 25%;">Họ và tên</td>
                <td><input type="text" id="txtHoTen" size="45" value="Phạm Ngọc Cẩm Đào"></td>
            </tr>
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" id="txtDiaChi" size="45" value="227 Nguyễn Văn Cừ"></td>
            </tr>
            <tr>
                <td>Điện thoại</td>
                <td><input type="text" id="txtDienThoai" size="25" value="8351056"></td>
            </tr>
            <tr>
                <td>Khách Việt Nam</td>
                <td><input type="checkbox" id="chkKhachVN" checked></td>
            </tr>
            <tr>
                <td>Chọn tour</td>
                <td>
                    <select id="cboTour">
                        <optgroup label="Miền Bắc">
                            <option value="Hà Nội - Hạ Long - Sapa">Hà Nội - Hạ Long - Sapa</option>
                            <option value="Hà Nội - Chùa Hương - Ninh Bình">Hà Nội - Chùa Hương - Ninh Bình</option>
                            <option value="Hà Nội - Cát Bà - Tuần Châu">Hà Nội - Cát Bà - Tuần Châu</option>
                        </optgroup>
                        <optgroup label="Miền Trung">
                            <option value="Huế - Bạch Mã - Đà Nẵng">Huế - Bạch Mã - Đà Nẵng</option>
                            <option value="Nha Trang - Đà lạt">Nha Trang - Đà lạt</option>
                            <option value="Buôn mê thuột - Gia lai - Kontum" selected>Buôn mê thuột - Gia lai - Kontum</option>
                        </optgroup>
                        <optgroup label="Miền Nam">
                            <option value="TP.HCM - Cần Thơ - Cà Mau">TP.HCM - Cần Thơ - Cà Mau</option>
                            <option value="TP.HCM - Mỹ Tho">TP.HCM - Mỹ Tho</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Phương tiện</td>
                <td>
                    <input type="radio" name="phuongTien" id="radMayBay" value="Máy bay"> Máy bay
                    <input type="radio" name="phuongTien" id="radOTo" value="Xe ô tô" checked> Xe ô tô
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <fieldset style="border: 2px solid #8b0000; width: 350px; height: 55px; margin: 5px 0;">
                        <legend align="center" style="font-style: italic; color: #b35900;">Số lượng đoàn khách</legend>
                        Người lớn <input type="text" id="txtNguoiLon" size="8" value="6">
                        &nbsp;&nbsp;&nbsp;
                        Trẻ em <input type="text" id="txtTreEm" size="8" value="4">
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td>Ghi chú thêm</td>
                <td>
                    <textarea id="txtGhiChu" style="width: 300px; height: 40px;">Có 2 trẻ em dưới 6 tuổi
Có 2 người ăn chay</textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="document.getElementById('lblThongBao').innerText = 'Bạn đã đăng ký thành công!!!';" style="padding: 2px 15px; background-color: #e0e0e0; border: 1px solid #777;">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center" style="height: 30px;">
                    <div id="lblThongBao" style="color: #e67300;"></div>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
